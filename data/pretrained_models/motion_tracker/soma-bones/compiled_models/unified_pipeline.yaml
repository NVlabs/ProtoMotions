_runtime:
  onnx_in_names: [current_rigid_body_ang_vel, current_rigid_body_pos, current_rigid_body_rot,
    current_rigid_body_vel, ground_heights, historical_actions, mimic_future_ang_vel,
    mimic_future_pos, mimic_future_rot, mimic_future_vel]
  onnx_out_names: [actions, joint_pos_targets, stiffness_targets, damping_targets]
  onnx_name_to_in_key: {current_rigid_body_ang_vel: current.rigid_body_ang_vel, current_rigid_body_pos: current.rigid_body_pos,
    current_rigid_body_rot: current.rigid_body_rot, current_rigid_body_vel: current.rigid_body_vel,
    ground_heights: ground_heights, historical_actions: historical.actions, mimic_future_ang_vel: mimic.future_ang_vel,
    mimic_future_pos: mimic.future_pos, mimic_future_rot: mimic.future_rot, mimic_future_vel: mimic.future_vel}
conventions: {quat_format: xyzw, mujoco_body_index_offset: 1, mujoco_free_joint_qpos_offset: 7,
  mujoco_free_joint_qvel_offset: 6, mujoco_cvel_layout: ang_vel_first, note: 'data.xquat[body_id
    + 1] for body quaternion (world body at 0); data.cvel[:, 0:3] is angular velocity;
    data.cvel[:, 3:6] is linear velocity.'}
robot:
  mjcf_path: mjcf/soma23_humanoid.xml
  usd_path: usd/soma23_humanoid_flat/soma23_humanoid_flat.usda
  num_bodies: 23
  num_dofs: 66
  anchor_body_name: null
  anchor_body_index: 0
  root_body_name: Hips
  root_body_index: 0
  body_names: [Hips, Spine1, Spine2, Chest, Neck1, Neck2, Head, RightShoulder, RightArm,
    RightForeArm, RightHand, LeftShoulder, LeftArm, LeftForeArm, LeftHand, RightLeg,
    RightShin, RightFoot, RightToeBase, LeftLeg, LeftShin, LeftFoot, LeftToeBase]
  joint_names: [Spine1_x, Spine1_y, Spine1_z, Spine2_x, Spine2_y, Spine2_z, Chest_x,
    Chest_y, Chest_z, Neck1_x, Neck1_y, Neck1_z, Neck2_x, Neck2_y, Neck2_z, Head_x,
    Head_y, Head_z, RightShoulder_x, RightShoulder_y, RightShoulder_z, RightArm_x,
    RightArm_y, RightArm_z, RightForeArm_x, RightForeArm_y, RightForeArm_z, RightHand_x,
    RightHand_y, RightHand_z, LeftShoulder_x, LeftShoulder_y, LeftShoulder_z, LeftArm_x,
    LeftArm_y, LeftArm_z, LeftForeArm_x, LeftForeArm_y, LeftForeArm_z, LeftHand_x,
    LeftHand_y, LeftHand_z, RightLeg_x, RightLeg_y, RightLeg_z, RightShin_x, RightShin_y,
    RightShin_z, RightFoot_x, RightFoot_y, RightFoot_z, RightToeBase_x, RightToeBase_y,
    RightToeBase_z, LeftLeg_x, LeftLeg_y, LeftLeg_z, LeftShin_x, LeftShin_y, LeftShin_z,
    LeftFoot_x, LeftFoot_y, LeftFoot_z, LeftToeBase_x, LeftToeBase_y, LeftToeBase_z]
