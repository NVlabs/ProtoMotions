    100.0, 100.0, 100.0, 100.0, 100.0, 100.0, 100.0, 100.0, 100.0]
  control_type: BUILT_IN_PD
  pd_target_max_accel: null
  action_ema_alpha: 0.8
  note: 'stiffness / damping are baked into the ONNX model (constant-folded); these
    values are for documentation only.  armature / effort_limits / velocity_limits
    are per-joint physical parameters from the MJCF.  pd_target_max_accel and action_ema_alpha
    are NOT baked in -- the deploy script must apply them externally.  action_ema_alpha:
    a_applied = alpha * a_policy + (1-alpha) * a_prev (matches MujocoSimulator._action_filter_alpha).'
timing:
  control_dt: 0.02
  physics_dt: 0.001
  decimation: 20
  mujoco: {physics_dt: 0.001, decimation: 20, control_dt: 0.02}
  isaaclab: {physics_dt: 0.008333, decimation: 4, control_dt: 0.033333}
  isaacgym: {physics_dt: 0.016667, decimation: 2, control_dt: 0.033333}
motion:
  future_step_indices: &id001 [1]
  future_dt_seconds: [0.02]
  note: Provide all future_step_indices frames to the ONNX model. The obs function
    internally selects a subset.
deploy_inputs:
  current.rigid_body_ang_vel:
    onnx_name: current_rigid_body_ang_vel
    shape: [1, 23, 3]
  current.rigid_body_pos:
    onnx_name: current_rigid_body_pos
    shape: [1, 23, 3]
  current.rigid_body_rot:
    onnx_name: current_rigid_body_rot
    shape: [1, 23, 4]
  current.rigid_body_vel:
    onnx_name: current_rigid_body_vel
    shape: [1, 23, 3]
  ground_heights:
    onnx_name: ground_heights
    shape: [1]
  historical.actions:
    onnx_name: historical_actions
    shape: [1, 3, 66]
  mimic.future_ang_vel:
    onnx_name: mimic_future_ang_vel
    shape: [1, 1, 23, 3]
  mimic.future_pos:
    onnx_name: mimic_future_pos
    shape: [1, 1, 23, 3]
  mimic.future_rot:
    onnx_name: mimic_future_rot
    shape: [1, 1, 23, 4]
    description: Reference motion body rotations (future steps, xyzw)
    source: MotionPlayer.get_future_references(frame, step_indices)
    future_step_indices: *id001
  mimic.future_vel:
    onnx_name: mimic_future_vel
    shape: [1, 1, 23, 3]
metadata: {checkpoint: data/pretrained_models/motion_tracker/soma-bones/last.ckpt}
