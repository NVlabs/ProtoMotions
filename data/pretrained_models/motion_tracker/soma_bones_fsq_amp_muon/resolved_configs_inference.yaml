    lambda_l2c2: '0.1'
    obs_pairs: {}
  adaptive_lr:
    enabled: 'False'
    desired_kl: '0.01'
    min_lr: 1e-05
    max_lr: '0.01'
  advantage_normalization:
    enabled: 'True'
    shift_mean: 'True'
    use_ema: 'True'
    ema_alpha: '0.05'
    min_std: '0.02'
    clamp_range: '4.0'
  amp_parameters:
    discriminator_reward_w: '0.2'
    discriminator_weight_decay: '0.0001'
    discriminator_logit_weight_decay: '0.01'
    discriminator_batch_size: '4096'
    discriminator_grad_penalty: '5.0'
    discriminator_optimization_ratio: '1'
    discriminator_replay_keep_prob: '0.01'
    discriminator_replay_size: '200000'
    discriminator_reward_threshold: '0.02'
    discriminator_max_cumulative_bad_transitions: '10'
    use_disc_critic: 'True'
  reference_obs_components:
    historical_max_coords_obs:
      compute_func: compute_historical_max_coords_from_motion_lib
      dynamic_vars: {}
      num_state_history_steps: '32'
      local_obs: 'True'
      root_height_obs: 'False'
      observe_contacts: 'False'
      history_steps:
      - 1
      - 2
      - 3
      - 4
      - 8
      - 16
      - 32
