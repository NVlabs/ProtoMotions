agent:
  batch_size: '16384'
  training_max_steps: '10000000000000'
  _target_: protomotions.agents.amp.agent.AMP
  model:
    _target_: protomotions.agents.amp.model.AMPModel
    in_keys:
    - max_coords_obs
    - nearest_surface
    - mimic_target_poses
    - historical_max_coords_obs
    out_keys:
    - action
    - mean_action
    - neglogp
    - value
    - disc_logits
    - disc_value
    actor:
      mu_key: mu
      in_keys:
      - max_coords_obs
      - nearest_surface
      - mimic_target_poses
      out_keys:
      - action
      - mean_action
      - neglogp
      _target_: protomotions.agents.ppo.model.PPOActor
      mu_model:
        _target_: protomotions.agents.common.fsq.FSQAutoEncoder
        in_keys: []
        out_keys: []
        encoder_out_keys:
        - latent
        decoder_out_keys:
        - mu
        encoder:
          normalize_obs: 'True'
          norm_clamp_value: '5'
          norm_ema_decay: '0.999'
          num_out: '40'
          layers:
          - units: '1024'
            activation: relu
            use_layer_norm: 'False'
          - units: '1024'
            activation: relu
            use_layer_norm: 'False'
          - units: '1024'
            activation: relu
            use_layer_norm: 'False'
          - units: '512'
            activation: relu
            use_layer_norm: 'False'
          - units: '256'
            activation: relu
            use_layer_norm: 'False'
          _target_: protomotions.agents.common.mlp.MLPWithConcat
          in_keys:
          - mimic_target_poses
          out_keys:
          - latent
          output_activation: None
          module_operations:
          - {}
        decoder:
          normalize_obs: 'True'
          norm_clamp_value: '5'
          norm_ema_decay: '0.999'
          num_out: '66'
          layers:
          - units: '1024'
            activation: relu
            use_layer_norm: 'False'
          - units: '1024'
            activation: relu
            use_layer_norm: 'False'
          - units: '1024'
            activation: relu
            use_layer_norm: 'False'
          - units: '512'
            activation: relu
            use_layer_norm: 'False'
          - units: '256'
            activation: relu
            use_layer_norm: 'False'
          _target_: protomotions.agents.common.mlp.MLPWithConcat
          in_keys:
          - max_coords_obs
          - nearest_surface
          - latent
          out_keys:
          - mu
          output_activation: None
          module_operations:
          - {}
        latent_key: latent
        num_fsq_levels: '9'
        num_fsq_scalars: '40'
      num_out: '66'
      actor_logstd: '-2.9'
      learnable_std: 'False'
    critic:
      normalize_obs: 'True'
      norm_clamp_value: '5'
      norm_ema_decay: '0.999'
      num_out: '1'
      layers:
      - units: '1024'
        activation: relu
        use_layer_norm: 'False'
      - units: '1024'
        activation: relu
        use_layer_norm: 'False'
      - units: '1024'
        activation: relu
        use_layer_norm: 'False'
      - units: '1024'
        activation: relu
        use_layer_norm: 'False'
      _target_: protomotions.agents.common.mlp.MLPWithConcat
      in_keys:
      - max_coords_obs
      - nearest_surface
      - mimic_target_poses
      out_keys:
      - value
      output_activation: None
      module_operations:
      - {}
    actor_optimizer:
      _target_: protomotions.agents.optimizer.muon.MuonWithAuxAdam
      lr: '0.0005'
      weight_decay: '0.01'
      eps: 1e-10
      betas: (0.9, 0.95)
      momentum: '0.95'
      adam_lr: '0.0001'
      adam_betas: (0.9, 0.95)
      adam_eps: 1e-10
      adam_weight_decay: '0.01'
      adam_fallback_module_patterns: []
      adam_fallback_parameter_patterns: []
      use_adam_for_sequential_projections: 'True'
    critic_optimizer:
      _target_: torch.optim.Adam
      lr: '0.0001'
      weight_decay: '0.0'
      eps: 1e-08
      betas: (0.95, 0.99)
    discriminator:
      models:
      - normalize_obs: 'True'
        norm_clamp_value: '5'
        norm_ema_decay: '0.999'
        num_out: '1'
        layers:
        - units: '1024'
          activation: relu
          use_layer_norm: 'False'
        - units: '1024'
          activation: relu
          use_layer_norm: 'False'
        - units: '512'
          activation: relu
          use_layer_norm: 'False'
        _target_: protomotions.agents.common.mlp.MLPWithConcat
        in_keys:
        - historical_max_coords_obs
        out_keys:
        - disc_logits
        output_activation: None
        module_operations:
        - {}
      _target_: protomotions.agents.amp.model.Discriminator
      in_keys:
      - historical_max_coords_obs
      out_keys:
      - disc_logits
    discriminator_optimizer:
      _target_: torch.optim.Adam
      lr: '0.0001'
      weight_decay: '0.0'
      eps: 1e-08
      betas: (0.9, 0.999)
    disc_critic:
      models:
      - normalize_obs: 'True'
        norm_clamp_value: '5'
        norm_ema_decay: '0.999'
        num_out: '1'
        layers:
        - units: '512'
          activation: relu
          use_layer_norm: 'False'
        - units: '256'
          activation: relu
          use_layer_norm: 'False'
        _target_: protomotions.agents.common.mlp.MLPWithConcat
        in_keys:
        - historical_max_coords_obs
        out_keys:
        - disc_value
        output_activation: None
        module_operations:
        - {}
      _target_: protomotions.agents.common.common.ModuleContainer
      in_keys:
      - historical_max_coords_obs
      out_keys:
      - disc_value
    disc_critic_optimizer:
      _target_: torch.optim.Adam
      lr: '0.0001'
      weight_decay: '0.0'
      eps: 1e-08
      betas: (0.9, 0.999)
  num_steps: '32'
  gradient_clip_val: '50.0'
  fail_on_bad_grads: 'False'
  check_grad_mag: 'True'
  gamma: '0.99'
  bounds_loss_coef: '0.0'
  task_reward_w: '0.8'
  num_mini_epochs: '2'
  training_early_termination: None
  save_epoch_checkpoint_every: '1000'
  save_last_checkpoint_every: '10'
  save_inference_checkpoint: 'True'
  max_episode_length_manager: None
  evaluator:
    _target_: protomotions.agents.evaluators.mimic_evaluator.MimicEvaluator
    evaluation_components:
      gt_error:
        compute_func: mean_body_pos_error
        dynamic_vars:
          current_rigid_body_pos: current.rigid_body_pos
          ref_rigid_body_pos: mimic.ref_state.rigid_body_pos
        threshold: '0.5'
      gr_error:
        compute_func: mean_body_rot_error
        dynamic_vars:
          current_rigid_body_rot: current.rigid_body_rot
          ref_rigid_body_rot: mimic.ref_state.rigid_body_rot
      max_joint_error:
        compute_func: max_body_pos_error
        dynamic_vars:
          current_rigid_body_pos: current.rigid_body_pos
          ref_rigid_body_pos: mimic.ref_state.rigid_body_pos
    max_eval_steps: '600'
    eval_metrics_every: '200'
    save_predicted_motion_lib_every: '3'
    motion_weights_rules:
      motion_weights_update_success_discount: '0.999'
      motion_weights_update_failure_discount: '0'
      min_motion_weight: 1/num_motions
    eval_action_ema_alpha: None
  normalize_rewards: 'True'
  normalized_reward_clamp_value: '5.0'
  reward_norm_ema_decay: None
  tau: '0.95'
  e_clip: '0.2'
  clip_critic_loss: 'True'
  actor_clip_frac_threshold: '0.6'
  entropy_coef: '0.005'
  l2c2:
