agent:
  batch_size: '8192'
  training_max_steps: '10000000000000'
  training_max_iterations: None
  _target_: protomotions.agents.ppo.agent.PPO
  model:
    _target_: protomotions.agents.ppo.model.PPOModel
    in_keys:
    - max_coords_obs
    - terrain
    - mimic_target_poses
    - previous_actions
    out_keys:
    - action
    - mean_action
    - neglogp
    - value
    actor:
      mu_key: actor_trunk_out
      in_keys:
      - max_coords_obs
      - terrain
      - mimic_target_poses
      - previous_actions
      out_keys:
      - action
      - mean_action
      - neglogp
      _target_: protomotions.agents.ppo.model.PPOActor
      mu_model:
        normalize_obs: 'True'
        norm_clamp_value: '5'
        norm_ema_decay: '0.999'
        num_out: '69'
        layers:
        - units: '1024'
          activation: relu
          use_layer_norm: 'False'
        - units: '1024'
          activation: relu
          use_layer_norm: 'False'
        - units: '1024'
          activation: relu
          use_layer_norm: 'False'
        - units: '1024'
          activation: relu
          use_layer_norm: 'False'
        - units: '1024'
          activation: relu
          use_layer_norm: 'False'
        - units: '1024'
          activation: relu
          use_layer_norm: 'False'
        _target_: protomotions.agents.common.mlp.MLPWithConcat
        in_keys:
        - max_coords_obs
        - terrain
        - mimic_target_poses
        - previous_actions
        out_keys:
        - actor_trunk_out
        output_activation: None
        module_operations:
        - {}
      num_out: '69'
      actor_logstd: '-2.9'
      learnable_std: 'False'
    critic:
      normalize_obs: 'True'
      norm_clamp_value: '5'
      norm_ema_decay: '0.999'
      num_out: '1'
      layers:
      - units: '1024'
        activation: relu
        use_layer_norm: 'False'
      - units: '1024'
        activation: relu
        use_layer_norm: 'False'
      - units: '1024'
        activation: relu
        use_layer_norm: 'False'
      - units: '1024'
        activation: relu
        use_layer_norm: 'False'
      _target_: protomotions.agents.common.mlp.MLPWithConcat
      in_keys:
      - max_coords_obs
      - terrain
      - mimic_target_poses
      - previous_actions
      out_keys:
      - value
      output_activation: None
      module_operations:
      - {}
    actor_optimizer:
      _target_: torch.optim.Adam
      lr: 2e-05
      weight_decay: '0.0'
      eps: 1e-08
      betas: (0.9, 0.999)
    critic_optimizer:
      _target_: torch.optim.Adam
      lr: '0.0001'
      weight_decay: '0.0'
      eps: 1e-08
      betas: (0.9, 0.999)
  num_steps: '32'
  gradient_clip_val: '50.0'
  fail_on_bad_grads: 'False'
  check_grad_mag: 'True'
  gamma: '0.99'
  bounds_loss_coef: '0.0'
  task_reward_w: '1.0'
  num_mini_epochs: '1'
  training_early_termination: None
  save_epoch_checkpoint_every: '1000'
  save_last_checkpoint_every: '10'
  save_inference_checkpoint: 'False'
  max_episode_length_manager: None
  evaluator:
    _target_: protomotions.agents.evaluators.mimic_evaluator.MimicEvaluator
    evaluation_components:
      gt_error:
        compute_func: mean_body_pos_error
        dynamic_vars:
          current_rigid_body_pos: current.rigid_body_pos
          ref_rigid_body_pos: mimic.ref_state.rigid_body_pos
        compile: 'True'
        threshold: '0.5'
      gr_error:
        compute_func: mean_body_rot_error
        dynamic_vars:
          current_rigid_body_rot: current.rigid_body_rot
          ref_rigid_body_rot: mimic.ref_state.rigid_body_rot
        compile: 'True'
      max_joint_error:
        compute_func: max_body_pos_error
        dynamic_vars:
          current_rigid_body_pos: current.rigid_body_pos
          ref_rigid_body_pos: mimic.ref_state.rigid_body_pos
        compile: 'True'
    max_eval_steps: '600'
    eval_metrics_every: '200'
    save_predicted_motion_lib_every: '3'
    motion_weights_rules:
      motion_weights_update_success_discount: '0.999'
      motion_weights_update_failure_discount: '0'
      min_motion_weight: 1/num_motions
    eval_action_ema_alpha: None
  normalize_rewards: 'True'
  normalized_reward_clamp_value: '5.0'
  reward_norm_ema_decay: None
  tau: '0.95'
  e_clip: '0.2'
  clip_critic_loss: 'True'
