[build-system]
requires = ["setuptools>=69.5.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "protomotions"
version = "3.1.0"
description = "GPU-accelerated simulation and learning for humanoid and character motion"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.8"
license = { file = "LICENSE.md" }
authors = [
  { name = "Chen Tessler" },
  { name = "Yifeng Jiang" },
]
keywords = [
  "character-animation",
  "humanoid-robotics",
  "physics-simulation",
  "reinforcement-learning",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  # Core declares only the minimum torch version and does not select a CUDA
  # build or package index. Simulator environments remain responsible for
  # installing a tested wheel that matches their CUDA/ABI combination.
  "dm-control>=1.0",
  "easydict>=1.10",
  "lightning>=2.3,<2.6",
  "matplotlib>=3.6",
  "moviepy>=2,<3; python_version >= '3.9'",
  "numpy>=1.21.1",
  "omegaconf==2.3.0",
  "PyYAML>=6",
  "rich>=13",
  "rtree>=1.2,<2",
  "scikit-image>=0.19",
  "scipy>=1.8",
  "tensordict>=0.5,<0.10",
  "termcolor>=1.1",
  "tensorboardX>=2.6",
  "torch>=2.2",
  "trimesh>=4.4",
  "wandb>=0.15,<0.24",
]

[project.optional-dependencies]
# NOTE: these groups deliberately carry no `python_version` markers. A marker
# that excludes the running interpreter makes the extra resolve to an EMPTY set,
# so `pip install "protomotions[mujoco]"` on an unsupported Python reports
# success while installing no simulator at all, and the failure only surfaces
# later as a bare ModuleNotFoundError. Without the marker the underlying
# distribution's own Requires-Python raises a real resolution error instead.
# Each group's supported Python version is documented in installation.rst.
mujoco = [
  "mujoco>=3.0,<4",
  "onnxruntime>=1.17",
  "openmesh==1.2.1",
  "tensordict==0.9.0",
  "wandb==0.23.0",
]
newton = [
  "dm-control==1.0.37",
  "mujoco==3.5.0",
  "newton[examples]==1.0.0",
  "warp-lang==1.12.0",
  "mujoco-warp==3.5.0.2",
  "newton-actuators==0.1.0",
  "onnxruntime>=1.17",
  "openmesh==1.2.1",
  "tensordict==0.9.0",
  "wandb==0.23.0",
]
isaacgym = []
# Install the pinned IsaacLab source checkout first, as documented in
# installation.rst. These constraints prevent ProtoMotions from silently
# downgrading that environment to the incompatible IsaacLab 2 / Isaac Sim 5
# stack. Platform markers remain because Isaac Sim publishes Linux x86_64
# wheels only.
isaaclab = [
  "isaaclab==12.0.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "isaacsim[all,extscache]==6.0.0.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "onnxruntime>=1.17",
  "tensordict==0.9.0",
  "torch>=2.11,<2.12; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "torchaudio>=2.11,<2.12; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "torchvision>=0.26,<0.27; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "wandb==0.23.0",
]
genesis = [
  "genesis-world",
  "lightning==2.5.0.post0",
  "mink==0.0.7",
  "onnxruntime>=1.17",
  "open3d==0.19.0",
  "PyOpenGL==3.1.4",
  "tensordict==0.9.0",
  "torch==2.5.0",
  "wandb==0.15.12",
]
docs = [
  "myst-parser",
  "nvidia-sphinx-theme",
  "sphinx>=7,<9",
  "sphinx-autodoc-typehints",
  "sphinx-copybutton",
]
dev = [
  "build>=1.2",
  # torch.onnx.export needs the `onnx` package itself at call time, not just
  # onnxruntime. The simulator extras ship onnxruntime for inference, so the
  # ONNX export tests pass on a developer machine that happens to have onnx
  # installed and fail on a clean one -- which is what CI is.
  "onnx>=1.16",
  "pytest>=8",
  "tomli>=2; python_version < '3.11'",
  # Used by the repository's data-conversion scripts under data/scripts/ and
  # usd_convert/, which are not part of the installed package.
  "typer>=0.6.1",
  "twine>=5",
]

[project.urls]
Documentation = "https://protomotions.github.io/"
Issues = "https://github.com/NVlabs/ProtoMotions/issues"
Repository = "https://github.com/NVlabs/ProtoMotions"

[project.scripts]
protomotions = "protomotions.cli:main"
protomotions-train-agent = "protomotions.cli:train_agent"
protomotions-inference-agent = "protomotions.cli:inference_agent"

[tool.setuptools]
include-package-data = false
license-files = ["LICENSE.md", "legal/*.txt"]

[tool.setuptools.packages.find]
include = ["protomotions", "protomotions.*"]
exclude = ["protomotions.tests", "protomotions.tests.*"]
namespaces = false

[tool.setuptools.package-data]
protomotions = [
  "data/assets/**/*",
  "data/assets/**/.asset_hash",
]

[tool.setuptools.exclude-package-data]
# SMPL and SMPL-H body-model assets are NOT covered by ProtoMotions' Apache-2.0
# licence (see legal/THIRD-PARTY SOFTWARE NOTICES AND ASSET LICENSES, section 4);
# they are attributed to the Max Planck Institute and their use is subject to the
# applicable SMPL/SMPL-H model terms. Redistributing them inside an
# Apache-2.0-labelled wheel would create an unauthorised distribution channel, so
# they are carved out of every built artifact. Users obtain them from MPI and
# expose them via PROTOMOTIONS_ASSET_ROOT, or work from a source checkout.
protomotions = [
  "data/assets/mesh/smpl/*",
  "data/assets/mesh/smpl/**/*",
  "data/assets/mjcf/smpl*.xml",
  "data/assets/usd/smpl*.usda",
]

[tool.ruff]
# Kept in step with the ruff pin in .pre-commit-config.yaml and the CI workflow
# so a local run and a CI run cannot disagree about what passes.

[tool.ruff.lint]
# No repository-wide ignores. E402 used to be one, to serve nine files -- which
# meant late imports anywhere else were waved through unexamined. It is now
# scoped: a per-file rule for the simulator modules, where it is structural, and
# an inline noqa on the handful of one-off scripts, where each one is visible at
# the line it applies to.

[tool.ruff.lint.per-file-ignores]
# E402 is not debt in the simulator modules, it is a hard requirement: IsaacGym
# and IsaacLab must be imported before torch or the process crashes, so these
# import deliberately late throughout. See protomotions/utils/simulator_imports.py.
"protomotions/simulator/**/simulator.py" = ["E402"]

# Experiment configs annotate their return type as a string forward reference
# and import the real config class inside the function body to keep module
# import cheap; ruff reads the forward reference as an undefined name (F821).
# The same functions take an `env_config` parameter that shadows the helper
# imported from the format module, which reads as F811. Both are intentional
# and documented in examples/experiments/format.py.
# F401 is here for a sharper reason than tidiness. A derived experiment
# re-exports its base's helpers by importing them, and the harness fetches
# apply_inference_overrides off the module by attribute name -- see
# import_experiment_relative_eval_overrides in protomotions/utils/config_utils.py,
# which raises AttributeError when it is absent. Ruff cannot see that use, so
# removing the "unused" import breaks evaluation at runtime rather than at import
# time, which is a bad way to find out.
"examples/experiments/**/*.py" = ["F401", "F821", "F811"]
"data/pretrained_models/**/*.py" = ["F401", "F821", "F811"]

# Test doubles read better as one-line lambdas than as nested defs.
"protomotions/tests/**/*.py" = ["E731"]

[tool.pytest.ini_options]
# An unregistered or misspelled marker is an error, not a warning. Without this,
# @pytest.mark.needs_lfss silently marks nothing and the test then runs in a job
# that cannot support it -- the same silent failure that made the hard-coded
# --deselect lists risky, since pytest ignores a --deselect naming a test that
# has been renamed and says nothing about it.
#
# Both spellings, deliberately. They are not redundant -- each one works on
# exactly one of the pytest versions this project supports, and fails quietly on
# the other, so either alone would leave half our developers unguarded:
#
#                                  pytest 8.3.4      pytest 9.0.3
#   addopts = "--strict-markers"   enforces          silently inert
#   strict_markers = true          unknown option    enforces
#
# The cost is one "Unknown config option: strict_markers" warning on pytest 8,
# which is preferable to raising the floor in [dev] over a lint guard. Drop the
# addopts line once pytest 8 is no longer supported.
addopts = "--strict-markers"
strict_markers = true
markers = [
  "needs_lfs: test reads a real Git LFS payload rather than the pointer file. CI jobs that check out without payloads run `-m 'not needs_lfs'`; the jobs that fetch payloads run the whole suite.",
]

[tool.uv]
conflicts = [
  [
    { extra = "mujoco" },
    { extra = "newton" },
  ],
  [
    { extra = "mujoco" },
    { extra = "isaacgym" },
  ],
  [
    { extra = "mujoco" },
    { extra = "isaaclab" },
  ],
  [
    { extra = "mujoco" },
    { extra = "genesis" },
  ],
  [
    { extra = "newton" },
    { extra = "isaacgym" },
  ],
  [
    { extra = "newton" },
    { extra = "isaaclab" },
  ],
  [
    { extra = "newton" },
    { extra = "genesis" },
  ],
  [
    { extra = "isaaclab" },
    { extra = "isaacgym" },
  ],
  [
    { extra = "isaacgym" },
    { extra = "genesis" },
  ],
  [
    { extra = "isaaclab" },
    { extra = "genesis" },
  ],
]
