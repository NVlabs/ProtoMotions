[build-system]
requires = ["setuptools>=69.5.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "protomotions"
version = "3.1.0"
description = "GPU-accelerated simulation and learning for humanoid and character motion"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.8"
license = { file = "LICENSE.md" }
authors = [
  { name = "Chen Tessler" },
  { name = "Yifeng Jiang" },
]
keywords = [
  "character-animation",
  "humanoid-robotics",
  "physics-simulation",
  "reinforcement-learning",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  # NOTE: keep `torch` and `numpy` UNCAPPED. Simulator environments are built by
  # hand against a specific CUDA/ABI combination (IsaacGym pins torch>=2.4, the
  # MuJoCo docs install a CPU-only wheel, Isaac Sim 5.x and Newton/warp require
  # numpy 2.x). An upper bound here makes `pip install -e .` uninstall and
  # replace those pinned wheels, silently breaking a working environment.
  # Per-simulator pins belong in the extras and requirements_<sim>.txt files.
  "dm-control>=1.0",
  "easydict>=1.10",
  "lightning>=2.3,<2.6",
  "matplotlib>=3.6",
  "moviepy>=2,<3; python_version >= '3.9'",
  "numpy>=1.21.1",
  "omegaconf==2.3.0",
  "PyYAML>=6",
  "rich>=13",
  "rtree>=1.2,<2",
  "scikit-image>=0.19",
  "scipy>=1.8",
  "tensordict>=0.5,<0.10",
  "termcolor>=1.1",
  "torch>=2.2",
  "trimesh>=4.4",
  "wandb>=0.15,<0.24",
]

[project.optional-dependencies]
# NOTE: these groups deliberately carry no `python_version` markers. A marker
# that excludes the running interpreter makes the extra resolve to an EMPTY set,
# so `pip install "protomotions[mujoco]"` on an unsupported Python reports
# success while installing no simulator at all, and the failure only surfaces
# later as a bare ModuleNotFoundError. Without the marker the underlying
# distribution's own Requires-Python raises a real resolution error instead.
# Each group's supported Python version is documented in installation.rst.
mujoco = [
  "mujoco>=3.0,<4",
  "onnxruntime>=1.17",
  "openmesh==1.2.1",
  "tensordict==0.9.0",
  "wandb==0.23.0",
]
newton = [
  "dm-control==1.0.37",
  "mujoco==3.5.0",
  "newton[examples]==1.0.0",
  "onnxruntime>=1.17",
  "openmesh==1.2.1",
  "tensordict==0.9.0",
  "wandb==0.23.0",
]
# IsaacGym is not distributed on PyPI; it must be downloaded from NVIDIA and
# installed manually. See installation.rst.
isaacgym = [
  "onnxruntime>=1.17",
]
# The platform markers below are retained (unlike the python_version markers):
# Isaac Sim publishes Linux x86_64 wheels only, and keeping them lets `uv lock`
# resolve on non-Linux machines instead of hard-failing the whole lockfile.
isaaclab = [
  "isaaclab[all,isaacsim]==2.3.2.post1; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "isaacsim[all]==5.1.0.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "onnxruntime>=1.17",
  "tensordict==0.9.0",
  "torch==2.7.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "torchvision==0.22.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "wandb==0.23.0",
]
genesis = [
  "genesis-world",
  "lightning==2.5.0.post0",
  "mink==0.0.7",
  "onnxruntime>=1.17",
  "open3d==0.19.0",
  "PyOpenGL==3.1.4",
  "tensordict==0.9.0",
  "torch==2.5.0",
  "wandb==0.15.12",
]
docs = [
  "myst-parser",
  "nvidia-sphinx-theme",
  "sphinx>=7,<9",
  "sphinx-autodoc-typehints",
  "sphinx-copybutton",
]
dev = [
  "build>=1.2",
  "pytest>=8",
  "tomli>=2; python_version < '3.11'",
  # Used by the repository's data-conversion scripts under data/scripts/ and
  # usd_convert/, which are not part of the installed package.
  "typer>=0.6.1",
  "twine>=5",
]

[project.urls]
Documentation = "https://protomotions.github.io/"
Issues = "https://github.com/NVlabs/ProtoMotions/issues"
Repository = "https://github.com/NVlabs/ProtoMotions"

[project.scripts]
protomotions = "protomotions.cli:main"
protomotions-train-agent = "protomotions.cli:train_agent"
protomotions-inference-agent = "protomotions.cli:inference_agent"

[tool.setuptools]
include-package-data = false
license-files = ["LICENSE.md", "legal/*.txt"]

[tool.setuptools.packages.find]
include = ["protomotions", "protomotions.*"]
exclude = ["protomotions.tests", "protomotions.tests.*"]
namespaces = false

[tool.setuptools.package-data]
# Ship the lightweight, Apache-2.0 asset trees only.
#
# `data/assets/usd/**` is deliberately excluded: it is 187 MB (of a 280 MB tree)
# and is required only by IsaacLab/IsaacSim. Bundling it produced a ~94 MB wheel
# against PyPI's 100 MB per-file limit, so a single additional robot would have
# blocked releases. IsaacLab users install from a Git LFS source checkout or
# point PROTOMOTIONS_ASSET_ROOT at a full asset tree.
protomotions = [
  "data/assets/mjcf/**/*",
  "data/assets/urdf/**/*",
  "data/assets/mesh/**/*",
  "data/assets/checkerboard/**/*",
]

[tool.setuptools.exclude-package-data]
# SMPL and SMPL-H body-model assets are NOT covered by ProtoMotions' Apache-2.0
# licence (see legal/THIRD-PARTY SOFTWARE NOTICES AND ASSET LICENSES, section 4);
# they are attributed to the Max Planck Institute and their use is subject to the
# applicable SMPL/SMPL-H model terms. Redistributing them inside an
# Apache-2.0-labelled wheel would create an unauthorised distribution channel, so
# they are carved out of every built artifact. Users obtain them from MPI and
# expose them via PROTOMOTIONS_ASSET_ROOT, or work from a source checkout.
protomotions = [
  "data/assets/mesh/smpl/**/*",
  "data/assets/mjcf/smpl*.xml",
  "data/assets/usd/smpl*.usda",
]

[tool.uv]
conflicts = [
  [
    { extra = "mujoco" },
    { extra = "newton" },
  ],
  [
    { extra = "mujoco" },
    { extra = "isaacgym" },
  ],
  [
    { extra = "mujoco" },
    { extra = "isaaclab" },
  ],
  [
    { extra = "mujoco" },
    { extra = "genesis" },
  ],
  [
    { extra = "newton" },
    { extra = "isaacgym" },
  ],
  [
    { extra = "newton" },
    { extra = "isaaclab" },
  ],
  [
    { extra = "newton" },
    { extra = "genesis" },
  ],
  [
    { extra = "isaaclab" },
    { extra = "isaacgym" },
  ],
  [
    { extra = "isaacgym" },
    { extra = "genesis" },
  ],
  [
    { extra = "isaaclab" },
    { extra = "genesis" },
  ],
]
